<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Victor — Code, Databases and PC Hardware</title>
  <desc id="desc">Dark purple technology banner with geometric neon accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08070f"/>
      <stop offset=".55" stop-color="#170b2c"/>
      <stop offset="1" stop-color="#351064"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#a78bfa" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="70" r="140" fill="#7c3aed" opacity=".22" filter="url(#blur)"/>
  <circle cx="180" cy="310" r="130" fill="#9333ea" opacity=".18" filter="url(#blur)"/>
  <path d="M760 0L1200 0 1200 340 1010 340Z" fill="#7c3aed" opacity=".08"/>
  <path d="M810 0L1200 0 1200 12 810 12Z" fill="url(#glow)" opacity=".9"/>
  <path d="M70 65H220" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="160" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="5">VICTOR</text>
  <text x="74" y="207" fill="#c4b5fd" font-family="Consolas, monospace" font-size="19" letter-spacing="4">DEVELOPMENT SYSTEMS STUDENT</text>
  <text x="74" y="263" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="21">CODE  /  DATABASES  /  PC HARDWARE</text>
  <g transform="translate(900 105)" fill="none" stroke="url(#glow)" stroke-width="3">
    <rect x="0" y="0" width="170" height="130" rx="16" opacity=".85"/>
    <path d="M28 35H142M28 65H115M28 95H132" stroke-linecap="round"/>
    <circle cx="145" cy="35" r="5" fill="#c084fc" stroke="none"/>
    <circle cx="118" cy="65" r="5" fill="#c084fc" stroke="none"/>
    <circle cx="135" cy="95" r="5" fill="#c084fc" stroke="none"/>
    <path d="M-25 65H-2M172 65H195M85 -25V-2M85 132V155" opacity=".65"/>
  </g>
  <path d="M70 304H1130" stroke="#a78bfa" stroke-opacity=".45"/>
  <text x="70" y="326" fill="#a78bfa" font-family="Consolas, monospace" font-size="11" letter-spacing="2">BUILD • LEARN • REPEAT</text>
